name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (GPU-independent)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # tests/ は依存ゼロ(vcpkg も VS2026 も不要)なので、エンジン本体ではなく
      # テストツリーだけを構成・ビルド・実行する。これで CI が安定して緑になる。
      - name: Configure
        run: cmake -S tests -B build-tests

      - name: Build
        run: cmake --build build-tests --config Release

      - name: Test
        run: ctest --test-dir build-tests --build-config Release --output-on-failure

  mcp-server-tests:
    name: MCP server tests (Node)
    # 開発機と同じ Windows で回す。テストはパス絡みの検査を含むので OS を変えない。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 型ストリップ(tsc なし)で .ts を直接動かすので Node 24 以上が要る。
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        working-directory: tools/mcp-server
        run: npm ci

      # schemaDrift.test.ts は「MCP のスキーマに足した引数が engine まで届かず
      # 黙って捨てられる」事故を実際に止めている。CI で走っていないと意味がない。
      - name: Test
        working-directory: tools/mcp-server
        run: npm test

  engine-build:
    name: Engine build (VS2026 + shaders)
    # VS2026 入りのホステッドイメージ。windows-latest の付け替えを待たずにラベルで固定する。
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      # vcpkg のビルド済みバイナリをここへ貯め、actions/cache で次回へ持ち越す。
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite
    steps:
      - uses: actions/checkout@v4

      # vcpkg.json の builtin-baseline を解決するため、フル履歴の vcpkg を自前で取る。
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-${{ runner.os }}-vs2026-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-vs2026-

      # cl / link / rc と WindowsSdkVerBinPath（= SDK の dxc.exe）を PATH に載せる。
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # src/core/generated/AssetKey.h（gitignore）。無いと configure が FATAL_ERROR。
      - name: Generate asset key
        shell: pwsh
        run: ./tools/gen_asset_key.ps1

      - name: Configure
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build build/release

      # DXC が見つからないと CMakeLists は黙ってシェーダーを飛ばすので、.cso が出たことを確かめる。
      - name: Check shaders compiled
        shell: pwsh
        run: |
          $cso = Get-ChildItem build/release/shaders -Filter *.cso -ErrorAction SilentlyContinue
          if (-not $cso) { Write-Error "シェーダー(.cso)が 1 つも生成されていない（DXC 未検出）"; exit 1 }
          Write-Host "compiled shaders: $($cso.Count)"

      # エンジンにリンクするテスト（tests/CMakeLists.txt の if(TARGET Core) 側）はここでしか回らない。
      - name: Test (engine-linked)
        run: ctest --preset windows-release
