<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>グローブ・グランプリ</title>
<style>
  :root { --bg:#0d0f14; --panel:#171a22; --line:#2a2f3b; --text:#eef1f7; --dim:#8b93a7; --accent:#ffc83a; --me:#3366ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; overscroll-behavior:none; }
  body { user-select:none; -webkit-user-select:none; touch-action:none; }
  .hide { display:none !important; }
  #join { max-width:420px; margin:0 auto; padding:32px 20px; }
  h1 { font-size:26px; margin:8px 0 4px; color:var(--accent); letter-spacing:.04em; }
  .sub { color:var(--dim); font-size:14px; margin-bottom:28px; }
  label { display:block; font-size:13px; color:var(--dim); margin:18px 0 6px; }
  input { width:100%; font-size:24px; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel); color:var(--text); outline:none; }
  #room { letter-spacing:.3em; font-variant-numeric:tabular-nums; }
  button { font:inherit; color:inherit; border:0; cursor:pointer; }
  .primary { width:100%; margin-top:28px; padding:16px; font-size:20px; font-weight:700; border-radius:12px;
    background:var(--accent); color:#1a1300; }
  .note { color:var(--dim); font-size:13px; line-height:1.7; margin-top:22px; }
  #err { color:#ff7a6b; font-size:14px; margin-top:14px; min-height:1em; }

  #game { position:fixed; inset:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:auto 1fr;
    padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left)); gap:10px; }
  #top { grid-column:1/3; display:flex; align-items:center; gap:12px; }
  #chip { width:18px; height:18px; border-radius:50%; background:var(--me); flex:none; box-shadow:0 0 12px var(--me); }
  #who { font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #rank { margin-left:auto; font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; }
  #lap { color:var(--dim); font-size:15px; font-variant-numeric:tabular-nums; }
  #left { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
  #wheel { width:min(42vw,46vh); height:min(42vw,46vh); transition:transform .05s linear; }
  #status { font-size:15px; color:var(--dim); text-align:center; min-height:1.3em; }
  .row { display:flex; gap:8px; }
  .small { padding:8px 12px; font-size:13px; border-radius:8px; background:var(--panel); border:1px solid var(--line); }
  #drag { position:absolute; inset:0; border-radius:16px; border:1px dashed var(--line); display:flex; align-items:flex-end;
    justify-content:center; padding-bottom:6px; color:var(--dim); font-size:12px; }
  #right { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; }
  #btn { width:min(38vw,52vh); height:min(38vw,52vh); border-radius:50%; font-size:22px; font-weight:800;
    background:radial-gradient(circle at 35% 30%,#ffe08a,#f2a400 60%,#b36f00); color:#2a1700;
    box-shadow:0 8px 0 #7a4b00,0 12px 24px rgba(0,0,0,.5); display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.25; }
  #btn:active,#btn.down { transform:translateY(6px); box-shadow:0 2px 0 #7a4b00,0 4px 10px rgba(0,0,0,.5); }
  #btn small { font-size:14px; font-weight:600; }
  #map { width:min(38vw,30vh); height:min(38vw,30vh); }
  #over { position:fixed; inset:0; background:rgba(13,15,20,.92); display:flex; align-items:center; justify-content:center;
    text-align:center; font-size:20px; line-height:1.7; padding:24px; }
</style>
</head>
<body>
<div id="join">
  <h1>グローブ・グランプリ</h1>
  <div class="sub">スマホがコントローラーになります</div>
  <label for="room">部屋番号（ゲーム画面の 4 桁）</label>
  <input id="room" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="1234">
  <label for="name">なまえ（8 文字まで）</label>
  <input id="name" maxlength="8" autocomplete="nickname" placeholder="なまえ">
  <button class="primary" id="go">参加する</button>
  <div id="err"></div>
  <div class="note">スマホを横にして、ハンドルのように<b>傾けて</b>曲がります。<br>
    アクセルは自動。右の大きなボタンでアイテム（スタート前はスタート）。<br>
    傾きが使えないときは、左側を指で左右にドラッグして曲がります。</div>
</div>

<div id="game" class="hide">
  <div id="top">
    <div id="chip"></div><div id="who"></div>
    <div id="lap"></div><div id="rank"></div>
  </div>
  <div id="left">
    <svg id="wheel" viewBox="-100 -100 200 200" aria-hidden="true">
      <circle r="88" fill="none" stroke="#3a4152" stroke-width="18"/>
      <circle r="88" fill="none" stroke="var(--me)" stroke-width="6" stroke-dasharray="40 513" transform="rotate(-97)"/>
      <rect x="-78" y="-8" width="156" height="16" rx="8" fill="#3a4152"/>
      <rect x="-8" y="0" width="16" height="78" rx="8" fill="#3a4152"/>
      <circle r="22" fill="#232835" stroke="#3a4152" stroke-width="4"/>
    </svg>
    <div id="status">つないでいます…</div>
    <div class="row">
      <button class="small" id="cal">まっすぐに合わせる</button>
      <button class="small" id="flip">左右逆</button>
    </div>
    <div id="drag" class="hide">← ここを指で左右にドラッグ →</div>
  </div>
  <div id="right">
    <button id="btn">スタート</button>
    <canvas id="map" width="300" height="300"></canvas>
  </div>
</div>
<div id="over" class="hide"></div>

<script>
const COLORS = { 1: "#e5261a", 2: "#3d6dff", 3: "#33d94d", 4: "#ffd21a" };
const NAMES = { 1: "赤", 2: "青", 3: "緑", 4: "黄" };
const $ = (id) => document.getElementById(id);
const qs = new URLSearchParams(location.search);
$("room").value = (qs.get("r") || "").replace(/\D/g, "").slice(0, 4);
try { $("name").value = localStorage.getItem("gk.name") || ""; } catch {}

let ws = null, myId = 0, steer = 0, btn = 0, flip = false, sendTimer = null;
let base = null, lastAngle = null, motionSeen = false, dragMode = false;
let state = null, lastItem = "", lastSt = -1, wakeLock = null;
try { flip = localStorage.getItem("gk.flip") === "1"; } catch {}

function over(text) { $("over").innerHTML = text; $("over").classList.toggle("hide", !text); }

$("go").onclick = async () => {
  const room = $("room").value.replace(/\D/g, "");
  const name = $("name").value.trim();
  if (room.length !== 4) { $("err").textContent = "部屋番号は 4 桁の数字です"; return; }
  try { localStorage.setItem("gk.name", name); } catch {}
  // iPhone は傾きを使う許可がボタンを押したときにしか取れない
  try {
    if (typeof DeviceMotionEvent !== "undefined" && DeviceMotionEvent.requestPermission) {
      const r = await DeviceMotionEvent.requestPermission();
      if (r !== "granted") dragMode = true;
    }
  } catch { dragMode = true; }
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
  $("join").classList.add("hide"); $("game").classList.remove("hide");
  window.addEventListener("devicemotion", onMotion);
  setTimeout(() => { if (!motionSeen) setDrag(true); }, 1500);
  connect(room, name);
};

function setDrag(on) { dragMode = on; $("drag").classList.toggle("hide", !on); }

// 重力の向きからハンドルの角度を出す（画面に垂直な軸まわりの回転）。最初の向きが「まっすぐ」
function onMotion(e) {
  const g = e.accelerationIncludingGravity;
  if (!g || g.x == null || g.y == null) return;
  if (Math.hypot(g.x, g.y) < 3) return;                  // ほぼ水平に寝かせていると角度が取れない
  motionSeen = true; if (dragMode) setDrag(false);
  const a = Math.atan2(g.x, g.y) * 180 / Math.PI;
  lastAngle = a;
  if (base === null) base = a;
  let d = a - base; d = ((d + 540) % 360) - 180;
  let s = Math.max(-1, Math.min(1, -d / 40));             // 40 度でいっぱい
  if (Math.abs(s) < 0.04) s = 0;
  steer = flip ? -s : s;
}
$("cal").onclick = () => { base = lastAngle; steer = 0; };
$("flip").onclick = () => { flip = !flip; try { localStorage.setItem("gk.flip", flip ? "1" : "0"); } catch {} };
$("flip").textContent = "左右逆";

// 指で曲がる（傾きが使えないとき）
let dragX0 = null;
$("left").addEventListener("pointerdown", (e) => { if (!dragMode || e.target.tagName === "BUTTON") return; dragX0 = e.clientX; $("left").setPointerCapture(e.pointerId); });
$("left").addEventListener("pointermove", (e) => { if (dragX0 === null) return; steer = Math.max(-1, Math.min(1, (e.clientX - dragX0) / 90)); });
const dragEnd = () => { dragX0 = null; if (dragMode) steer = 0; };
$("left").addEventListener("pointerup", dragEnd); $("left").addEventListener("pointercancel", dragEnd);

const press = (e) => { e.preventDefault(); btn++; $("btn").classList.add("down"); navigator.vibrate?.(15); };
$("btn").addEventListener("pointerdown", press);
$("btn").addEventListener("pointerup", () => $("btn").classList.remove("down"));
$("btn").addEventListener("pointerleave", () => $("btn").classList.remove("down"));

function connect(room, name) {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  // スマホごとの目印（開き直しても同じ人として扱ってもらう）
  let dev = "";
  try { dev = localStorage.getItem("gk.dev") || ""; } catch {}
  if (!dev) {
    dev = Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
    try { localStorage.setItem("gk.dev", dev); } catch {}
  }
  ws = new WebSocket(`${proto}//${location.host}/ws?room=${room}&role=phone&name=${encodeURIComponent(name)}&dev=${dev}`);
  ws.onopen = () => { $("status").textContent = "つながりました"; };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.t === "hello") { myId = m.id; if (!m.host) $("status").textContent = "ゲームの PC を待っています…"; }
    else if (m.t === "full") { over("この部屋は満員です（スマホは 3 台まで）"); }
    else if (m.t === "host") { $("status").textContent = m.on ? "ゲームとつながりました" : "ゲームの PC とつながっていません"; }
    else if (m.t === "state") { state = m; render(); }
  };
  const me = ws;
  ws.onclose = (e) => {
    if (ws !== me) return;   // もう新しい接続に替わっている
    if (e.code === 4002) { over("別の画面でつながりました（この画面は閉じてください）"); return; }
    if (e.code === 4001) return;   // 満員（over 済み）
    if (e.code === 4003) {   // ゲームが始まり直した → すぐ入り直す
      $("status").textContent = "ゲームが始まり直しました。入り直します";
      setTimeout(() => connect(room, name), 300);
      return;
    }
    $("status").textContent = "切れました。3 秒後につなぎ直します";
    setTimeout(() => connect(room, name), 3000);
  };
  clearInterval(sendTimer);
  sendTimer = setInterval(() => {
    if (ws && ws.readyState === 1) ws.send(`${steer.toFixed(3)},${btn}`);
    $("wheel").style.transform = `rotate(${steer * 90}deg)`;
  }, 33);
}

function render() {
  const me = (state.p || []).find((p) => p.id === myId);
  const slot = me ? me.slot : 0;
  const col = COLORS[slot] || "#8b93a7";
  document.documentElement.style.setProperty("--me", col);
  $("who").textContent = me ? (slot ? `${NAMES[slot]}のカート  ${me.name}` : `${me.name}（次のレースから）`) : "";
  const st = state.st;
  if (me && slot) {
    $("rank").textContent = `${me.rank}位`;
    $("lap").textContent = me.done ? "ゴール！"
      : `LAP ${Math.min(me.lap, state.laps)}/${state.laps}  ${me.kmh}km/h` + (me.gear ? `  ${me.gear}速` : "");
  } else { $("rank").textContent = ""; $("lap").textContent = ""; }
  let label = "スタート", sub = "";
  if (st === 1) { label = "ロケット"; sub = "緑の直前に押す"; }
  else if (st === 2) {
    if (me && me.roul) { label = "？？？"; }
    else if (me && me.item) { label = me.item; sub = `×${me.n}  押してダッシュ`; }
    else { label = "アイテム"; sub = "ボックスを通る"; }
  } else if (st === 3) { label = "もう一回"; sub = "全員ゴールしたら"; }
  $("btn").innerHTML = `${label}${sub ? `<small>${sub}</small>` : ""}`;
  const msg = { 0: "全員そろったらボタンでスタート", 1: "カウントダウン！", 2: "", 3: "レース終了" }[st] ?? "";
  if (msg) $("status").textContent = msg;
  if (st === 2 && lastSt === 1) navigator.vibrate?.(200);
  if (me && me.item && !lastItem) navigator.vibrate?.([40, 40, 80]);
  lastItem = me ? (me.item || "") : ""; lastSt = st;
  drawMap(slot);
}

function drawMap(slot) {
  const c = $("map"), x = c.getContext("2d");
  x.clearRect(0, 0, c.width, c.height);
  const t = state.trk; if (!t || !t.length) return;
  let minx = 1e9, maxx = -1e9, minz = 1e9, maxz = -1e9;
  for (const [a, b] of t) { minx = Math.min(minx, a); maxx = Math.max(maxx, a); minz = Math.min(minz, b); maxz = Math.max(maxz, b); }
  const sc = 270 / Math.max(maxx - minx, maxz - minz);
  const mp = (a, b) => [15 + (a - minx) * sc, 285 - (b - minz) * sc];
  x.strokeStyle = "#3a4152"; x.lineWidth = 10; x.lineJoin = "round"; x.beginPath();
  t.forEach(([a, b], i) => { const [px, py] = mp(a, b); i ? x.lineTo(px, py) : x.moveTo(px, py); });
  x.closePath(); x.stroke();
  for (const [a, b, s] of state.k || []) {
    const [px, py] = mp(a, b);
    x.fillStyle = COLORS[s]; x.beginPath(); x.arc(px, py, s === slot ? 11 : 7, 0, Math.PI * 2); x.fill();
    if (s === slot) { x.strokeStyle = "#fff"; x.lineWidth = 3; x.stroke(); }
  }
}
</script>
</body>
</html>
